name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # running three parallel jobs
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # version based on tag
      - name: Sync version from tag
        working-directory: ./frontend
        shell: bash
        run: |
          CLEAN_VERSION=${GITHUB_REF_NAME#v}
          echo "Syncing package.json version to $CLEAN_VERSION"
          npm version $CLEAN_VERSION --no-git-tag-version

        # setting up python and building backend
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: "pip"

      - name: Install Backend Deps
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Backend (PyInstaller)
        working-directory: ./backend
        run: |
          pyinstaller api.spec --noconfirm --clean

      # setting up node and building frontend
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Deps
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build Electron App
        working-directory: ./frontend
        run: pnpm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # After all platform builds upload assets, ensure the tag is published + Latest
  finalize:
    name: Mark release as Latest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release and set as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Wait briefly in case the last asset upload is still settling
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            echo "Release $TAG not visible yet; retrying ($i/5)..."
            sleep 5
          done
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest=true
          echo "Release $TAG is now published and marked as Latest."
